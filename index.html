<!DOCTYPE html>
<html lang="en">

  <head>
    <link rel="stylesheet" href="style.css">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lightbox Viewer</title>
  </head>

  <body>
    <main>
        <div class="lightbox">
            <button class="close-btn" id="close-btn">&times;</button>
            <img src="" alt="" id="lightbox-image" class="lightbox-img">
        </div>
        <h1 class="header">Museum Gallery</h1>
        <div class="gallery">
            <img class="gallery-item" src="https://cdn.freecodecamp.org/curriculum/labs/stonehenge-thumbnail.jpg" alt="">
            <img class="gallery-item" src="https://cdn.freecodecamp.org/curriculum/labs/storm-thumbnail.jpg" alt="">
            <img class="gallery-item" src="https://cdn.freecodecamp.org/curriculum/labs/trees-thumbnail.jpg" alt="">
        </div>
        <script src="script.js"></script>
    </main>
  </body>

</html>
